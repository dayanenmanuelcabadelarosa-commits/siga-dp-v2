# =============================================================================
#  SIGA-DP v2 — nginx del frontend
# =============================================================================
#  Escucha en 8080 (Cloud Run) y sirve la compilación de Vite:
#    · /assets/*  -> archivos con hash, caché inmutable de un año.
#    · resto      -> index.html (enrutado del lado del cliente, React Router).
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Archivos estáticos con hash en el nombre: caché de un año.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El resto es la aplicación de una sola página.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
