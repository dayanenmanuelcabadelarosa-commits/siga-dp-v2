name: Despliegue SIGA-DP v2 (Cloud Build + Cloud Run)

on:
  push:
    branches: [ main, principal ]

jobs:
  pruebas-y-despliegue:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # para autenticar con Workload Identity Federation

    steps:
      # 1. Traer el código
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecutar pruebas (API contra PostgreSQL y cliente)
      #    Nota: en GitHub Actions necesitas un servicio de PostgreSQL.
      - name: Ejecutar pruebas
        run: npm test

      # 5. Autenticar con Google Cloud (Workload Identity Federation)
      #    Configura esto en GCP: IAM > Carga de trabajo > Grupo de identidades.
      - name: Autenticar con Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      # 6. Configurar gcloud
      - name: Configurar gcloud
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      # 7. Ejecutar Cloud Build (construye imagen, la sube a Artifact Registry y despliega en Cloud Run)
      - name: Desplegar con Cloud Build
        run: |
          gcloud builds submit --config=cloudbuild.yaml \
            --substitutions=_REGION=us-central1,_REPO=siga-dp,_SERVICE=siga-dp,_IMAGE=siga-dp,_CLOUDSQL_INSTANCE=${{ secrets.CLOUDSQL_INSTANCE }}
