# =============================================================================
#  Despliegue manual desde GitHub Actions (opcional)
# =============================================================================
#
#  La vía recomendada es un disparador (trigger) de Cloud Build conectado a
#  GitHub: no necesita secretos en GitHub y despliega al hacer push a main.
#  Ver docs/DESPLIEGUE-GCP.md, sección "Automatización".
#
#  Este workflow queda como alternativa manual. No se ejecuta en cada push:
#  antes corría `npm test` sin una base PostgreSQL y fallaba siempre. Ahora:
#    �� Se lanza a mano (workflow_dispatch).
#    �� Levanta PostgreSQL 16 como servicio para las pruebas de la API.
#    �� Autentica con Workload Identity Federation (sin claves JSON).
#    �� Llama a Cloud Build, que construye y despliega.
#
#  Secretos necesarios en GitHub (Settings > Secrets and variables > Actions):
#    GCP_WORKLOAD_IDENTITY_PROVIDER
#    GCP_SERVICE_ACCOUNT
#
#  No se guarda ninguna contraseña de producción en GitHub.
# =============================================================================

name: Despliegue manual SIGA-DP v2

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "ID del proyecto de Google Cloud"
        required: true
        type: string
      region:
        description: "Región de Cloud Run"
        required: true
        default: us-central1
        type: string
      cloudsql_instance:
        description: "Nombre completo de Cloud SQL: proyecto:region:instancia"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: despliegue-siga-dp
  cancel-in-progress: false

jobs:
  pruebas:
    name: Lint, tipos, build y pruebas de API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      BD_HOST: localhost
      BD_PUERTO: "5432"
      BD_USUARIO: postgres
      BD_CLAVE: postgres
      BD_NOMBRE: siga_dp_v2
      CLAVE_SESION: clave-solo-para-pruebas-en-github-actions-1234567890

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run tipos

      - name: Compilar el cliente
        run: npm run build

      - name: Pruebas de la API contra PostgreSQL real
        run: npm run test:api

  desplegar:
    name: Construir y desplegar con Cloud Build
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Autenticar con Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.project_id }}

      - name: Cloud Build (imagen + Cloud Run)
        run: |
          gcloud builds submit \
            --project="${{ inputs.project_id }}" \
            --config=cloudbuild.yaml \
            --substitutions=_REGION=${{ inputs.region }},_CLOUDSQL_INSTANCE=${{ inputs.cloudsql_instance }}

      - name: Mostrar la URL pública
        run: |
          gcloud run services describe siga-dp \
            --project="${{ inputs.project_id }}" \
            --region="${{ inputs.region }}" \
            --format='value(status.url)'
