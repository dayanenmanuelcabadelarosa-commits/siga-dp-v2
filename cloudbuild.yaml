# Configuracion de Cloud Build para SIGA-DP v2.
# Construye la imagen, la sube a Artifact Registry y despliega en Cloud Run.

substitutions:
  _REGION: us-central1
  _REPO: siga-dp
  _SERVICE: siga-dp
  _IMAGE: siga-dp
  _CLOUDSQL_INSTANCE: PROJECT_ID:us-central1:siga-dp-db

steps:
  # 1. Construir la imagen Docker.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest'
      - '.'

  # 2. Subir la imagen a Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest'

  # 3. Desplegar en Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--add-cloudsql-instances'
      - '${_CLOUDSQL_INSTANCE}'
      - '--set-env-vars'
      - 'NODE_ENV=production,PUERTO=8080,BD_HOST=/cloudsql/${_CLOUDSQL_INSTANCE},BD_USUARIO=postgres,BD_NOMBRE=siga_dp_v2'
      - '--set-secrets'
      - 'BD_CLAVE=bd-clave:latest'
      - '--set-secrets'
      - 'CLAVE_SESION=clave-sesion:latest'
      - '--set-secrets'
      - 'PAYPAL_CLIENT_ID=paypal-client-id:latest'
      - '--set-secrets'
      - 'PAYPAL_CLIENT_SECRET=paypal-client-secret:latest'
      - '--set-secrets'
      - 'IMECF_API_KEY=imecf-api-key:latest'
      - '--set-secrets'
      - 'GROQ_API_KEY=groq-api-key:latest'
      - '--set-env-vars'
      - 'PAYPAL_ENTORNO=sandbox'
      - '--set-env-vars'
      - 'PAYPAL_MONEDA=USD'
      - '--set-env-vars'
      - 'IMECF_API_URL=https://ecf-platform-backend-50801509587.us-central1.run.app'
      - '--set-env-vars'
      - 'GROQ_MODEL=openai/gpt-oss-120b'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest'
"